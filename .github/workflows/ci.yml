name: CI

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop --format github

  test:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run specs
      run: bundle exec rspec

  publish:
    name: Build + Publish
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - uses: rubygems/release-gem@v1

    # release-gem only pushes to RubyGems. It leaves the built gem in pkg/,
    # which is what gets attached here.
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"

        # Body: this version's CHANGELOG section, minus the title marker.
        awk -v h="## ${version} (" '
          index($0, h) == 1 { f = 1; next }
          f && /^## / { exit }
          f && /^<!-- title:/ { next }
          f
        ' CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "::error::CHANGELOG.md has no '## ${version} (...)' section to release from"
          exit 1
        fi

        # Title: "<tag> — <descriptor>" from the section's title marker. The
        # version comes from the tag, so it cannot drift from what was released.
        # A missing marker is cosmetic and must not fail the release.
        descriptor=$(awk -v h="## ${version} (" '
          index($0, h) == 1 { f = 1; next }
          f && /^## / { exit }
          f && sub(/^<!-- title:[[:space:]]*/, "") {
            sub(/[[:space:]]*-->[[:space:]]*$/, ""); print; exit
          }
        ' CHANGELOG.md)
        if [ -n "$descriptor" ]; then
          title="$GITHUB_REF_NAME — $descriptor"
        else
          title="$GITHUB_REF_NAME"
        fi

        gh release create "$GITHUB_REF_NAME" pkg/*.gem \
          --title "$title" \
          --notes-file notes.md \
          --verify-tag
