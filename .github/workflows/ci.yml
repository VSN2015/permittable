name: CI

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop --format github

  test:
    name: RSpec
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - name: Run specs
      run: bundle exec rspec

  publish:
    name: Build + Publish
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler: latest
        bundler-cache: true
    - uses: rubygems/release-gem@v1

    # release-gem only pushes to RubyGems. It leaves the built gem in pkg/,
    # which is what gets attached here.
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v h="## ${version} (" 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f' \
          CHANGELOG.md > notes.md
        if [ ! -s notes.md ]; then
          echo "::error::CHANGELOG.md has no '## ${version} (...)' section to release from"
          exit 1
        fi
        gh release create "$GITHUB_REF_NAME" pkg/*.gem \
          --title "$GITHUB_REF_NAME" \
          --notes-file notes.md \
          --verify-tag
